version: '3.8'

services:
  nacos:
    image: nacos/nacos-server:v2.3.0
    container_name: nacos-server
    restart: always
    platform: linux/amd64  # 确保在M1/M3芯片上正常运行
    environment:
      # 运行模式：standalone单机模式
      MODE: standalone
      # JVM参数优化
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
    ports:
      - "8848:8848"      # Nacos控制台端口
      - "9848:9848"      # Nacos客户端gRPC请求服务端端口
      - "9849:9849"      # Nacos客户端gRPC请求服务端端口（用于服务端间通信）
    volumes:
      - ./logs:/home/nacos/logs
      - ./data:/home/nacos/data
    networks:
      - nacos-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  nacos-network:
    driver: bridge